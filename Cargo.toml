[workspace]
resolver = "2"
members = [
    "crates/vortex-core",
    "crates/vortex-native-host",
    "crates/vortex-gui",
]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
anyhow = "1.0"
thiserror = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.44", features = ["full"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "stream", "gzip", "brotli", "deflate", "cookies"] }
axum = "0.8"
tower-http = { version = "0.6", features = ["cors"] }
url = "2.5"
uuid = { version = "1.16", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
regex = "1.11"
dirs = "6.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
sha2 = "0.10"
md-5 = "0.10"
hex = "0.4"
futures = "0.3"
bytes = "1.10"
parking_lot = "0.12"
librqbit = { version = "9.1", default-features = false, features = ["rust-tls"] }
eframe = { version = "0.37", default-features = false, features = ["clipboard", "default_fonts", "glow", "persistence"] }
egui = "0.37"
rfd = "0.18"
tray-icon = "0.27"
arboard = "3.4"
open = "5.3"
